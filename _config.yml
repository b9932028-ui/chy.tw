# Site settings
title: chy.tw # site title
description: >- # site description
  本網站除了程式碼之外的文字不含AI產物，100%手寫。
lang: zh-TW # default lang
timezone: Asia/Taipei # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/b9932028-ui/chy.tw # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: CHY.TW # author name
  bio: >- # tell to the world
    本網站除了程式碼之外的文字不含AI產物，100%手寫。
  github: b9932028-ui # github username
  email: b9932028@gmail.com # email adress
  avatar: /assets/img/avatar.jpg # change with your own avatar

# URL settings
url: "https://chy.tw" #
baseurl: ""
permalink: /:title/
google_analytics: # leave it blank if not wish

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: true

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
sass:
  style: compressed

exclude:
  - AGENTS.md
  - dev
  - Gemfile
  - Gemfile.lock
  - HOW_TO.md
  - LICENSE
  - README.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
